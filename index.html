            color: black;
            padding: 8px 16px;

            border: 1px solid #ddd;

        }
        .pagination a:hover:not(.active) {

        .info {

            margin-top: 20px;
            color: #666;

        // Pagination settings

        // Initialize the table when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            updateTable();
        });
        
        // Filter table based on search input
        function filterTable() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredIngredients = allIngredients.filter(ingredient => 
                ingredient.toLowerCase().includes(searchTerm)
            );
            
            // Reset to first page when search changes
            currentPage = 1;
            
            // Update the table with filtered results
            updateTable();
        }
        
        // Update table with current page items
        function updateTable() {
            const tableBody = document.getElementById('tableBody');
            const paginationElement = document.getElementById('pagination');
            const infoElement = document.getElementById('info');
            
            // Calculate pagination
            const totalPages = Math.ceil(filteredIngredients.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredIngredients.length);
            const currentItems = filteredIngredients.slice(startIndex, endIndex);
            
            // Clear existing table content
            tableBody.innerHTML = '';
            
            // Add rows for current page
            if (currentItems.length === 0) {
                tableBody.innerHTML = '<tr><td>No matching ingredients found</td></tr>';
            } else {
                currentItems.forEach(ingredient => {
                    const row = document.createElement('tr');
                    const cell = document.createElement('td');
                    const link = document.createElement('a');
                    
                    link.href = `https://m.chemicalbook.com/Search_EN.aspx?keyword=${encodeURIComponent(ingredient)}`;
                    link.target = '_blank';
                    link.textContent = ingredient;
                    
                    cell.appendChild(link);
                    row.appendChild(cell);
                    tableBody.appendChild(row);
                });
            }
            
            // Update pagination
            updatePagination(totalPages);
            
            // Update info text
            if (filteredIngredients.length > 0) {
                infoElement.textContent = `Showing ${startIndex + 1} to ${endIndex} of ${filteredIngredients.length} ingredients`;
            } else {
                infoElement.textContent = 'No ingredients to display';
            }
        }
        
        // Update pagination links
        function updatePagination(totalPages) {
            const paginationElement = document.getElementById('pagination');
            paginationElement.innerHTML = '';
            
            if (totalPages <= 1) {
                return;
            }
            
            // Previous button
            if (currentPage > 1) {
                addPaginationLink(paginationElement, currentPage - 1, 'Previous');
            }
            
            // Page number links
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(startPage + maxVisiblePages - 1, totalPages);
            
            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                addPaginationLink(paginationElement, i, i.toString(), i === currentPage);
            }
            
            // Next button
            if (currentPage < totalPages) {
                addPaginationLink(paginationElement, currentPage + 1, 'Next');
            }
        }
        
        // Helper function to add pagination link
        function addPaginationLink(container, page, text, isActive = false) {
            const link = document.createElement('a');
            link.href = '#';
            link.textContent = text;
            
            if (isActive) {
                link.classList.add('active');
            }
            
            link.addEventListener('click', function(e) {
                e.preventDefault();
                currentPage = page;
                updateTable();
                window.scrollTo(0, 0);
            });
            
            container.appendChild(link);
        }
    </script>
</body>
</html>
